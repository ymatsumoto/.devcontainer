# Storage configuration for nested (podman-in-podman) usage.
# fuse-overlayfs works inside a privileged container; if /dev/fuse is
# unavailable, change driver to "vfs" (slower, more disk, but always works).
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mount_program = "/usr/bin/fuse-overlayfs"
